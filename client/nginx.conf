server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cabeçalhos de segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compressão
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

    # Assets com hash no nome: cache longo e imutável.
    # add_header em nível de location descarta os herdados do server,
    # por isso os cabeçalhos de segurança são redeclarados aqui.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # index.html NUNCA pode ficar em cache: é ele que aponta para o bundle
    # com hash. Sem Cache-Control explícito o navegador aplica cache
    # heurístico, reusa o HTML antigo e continua carregando o JS da versão
    # anterior — o deploy sobe correto e a correção não aparece em produção.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # SPA fallback: qualquer rota cai no index.html (React Router/estado interno)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
